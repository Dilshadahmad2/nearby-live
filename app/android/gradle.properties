org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Windows: the Kotlin compile daemon fails ("Daemon compilation failed") when the
# project and the Pub cache are on different drives (e.g. D:\project and
# C:\Users\...\Pub\Cache), because incremental compilation cannot relate paths
# across drives. Compile in the Gradle process, non-incrementally.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
