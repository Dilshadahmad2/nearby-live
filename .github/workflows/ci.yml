name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nearby
          POSTGRES_PASSWORD: nearby
          POSTGRES_DB: nearby
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nearby" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
        env:
          REDIS_TEST_URL: redis://localhost:6379/15
      - name: Seed a real PostgreSQL
        env:
          DATABASE_URL: postgres://nearby:nearby@localhost:5432/nearby?sslmode=disable
        run: go run ./cmd/seed -data ./data
      - name: Docker image builds
        run: docker build -t nearby-live-backend .

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-live-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
